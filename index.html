<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poseídos</title>
    <style>
      :root {
        --hud-bg: rgba(15, 23, 42, 0.58);
        --hud-border: rgba(148, 163, 184, 0.22);
        --hud-text: #e2e8f0;
        --hud-muted: #94a3b8;
        --hud-accent: #60a5fa;
      }
      html, body, #app { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; }
      canvas { display: block; width: 100%; height: 100%; }
      /* Skills: glass-dark + technical wireframe labels — un acento, tipografía compacta */
      #hud {
        position: absolute; left: 12px; bottom: 12px;
        color: var(--hud-text);
        font: 11.5px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.03em;
        pointer-events: none;
        max-width: min(520px, calc(100% - 24px));
        white-space: pre-wrap;
        z-index: 2;
        padding: 8px 11px;
        border-radius: 10px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.015)),
          var(--hud-bg);
        border: 1px solid var(--hud-border);
        box-shadow: 0 14px 32px rgba(2, 6, 23, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px) saturate(140%);
        -webkit-backdrop-filter: blur(12px) saturate(140%);
      }
      #hud.hud-help {
        max-width: min(640px, calc(100% - 24px));
        line-height: 1.45;
      }

      /* Moodles: pills técnicas glass (Skills P1) — umbrales ok/warn/critical */
      #moodles {
        position: absolute; left: 12px; bottom: 118px;
        display: flex; flex-wrap: nowrap; gap: 5px;
        z-index: 2; pointer-events: none;
        max-width: min(720px, calc(100% - 24px));
      }
      .moodle {
        display: inline-flex; align-items: center; gap: 5px;
        padding: 4px 7px 4px 6px;
        border-radius: 999px;
        font: 10px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--hud-text);
        background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02)),
          var(--hud-bg);
        border: 1px solid var(--hud-border);
        box-shadow: 0 8px 18px rgba(2, 6, 23, 0.35), inset 0 1px 0 rgba(255,255,255,0.1);
        backdrop-filter: blur(10px) saturate(140%);
        -webkit-backdrop-filter: blur(10px) saturate(140%);
      }
      .moodle-glyph { font-size: 11px; opacity: 0.9; }
      .moodle-label { color: var(--hud-muted); font-weight: 600; }
      .moodle-value { color: var(--hud-accent); font-variant-numeric: tabular-nums; min-width: 1.4em; }
      .moodle[data-level="ok"] {
        border-color: rgba(148, 163, 184, 0.28);
      }
      .moodle[data-level="ok"] .moodle-value { color: #86efac; }
      .moodle[data-level="warn"] {
        border-color: rgba(251, 191, 36, 0.55);
        box-shadow: 0 8px 18px rgba(2, 6, 23, 0.35), 0 0 12px rgba(251, 191, 36, 0.12),
          inset 0 1px 0 rgba(255,255,255,0.1);
      }
      .moodle[data-level="warn"] .moodle-value { color: #fbbf24; }
      .moodle[data-level="warn"] .moodle-label { color: #fcd34d; }
      .moodle[data-level="critical"] {
        border-color: rgba(248, 113, 113, 0.65);
        box-shadow: 0 8px 18px rgba(2, 6, 23, 0.35), 0 0 14px rgba(248, 113, 113, 0.18),
          inset 0 1px 0 rgba(255,255,255,0.1);
      }
      .moodle[data-level="critical"] .moodle-value { color: #f87171; }
      .moodle[data-level="critical"] .moodle-label { color: #fca5a5; }

      /* Hotbar: 5 slots bottom-center, glass-dark como moodles; no tapa #hud ni inv */
      #hotbar {
        position: absolute; left: 50%; bottom: 18px;
        transform: translateX(-50%);
        display: flex; flex-wrap: nowrap; gap: 6px;
        z-index: 3; pointer-events: none;
      }
      .hotbar-slot {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 3px;
        min-width: 68px; max-width: 86px;
        padding: 6px 7px 5px;
        border-radius: 10px;
        font: 10px/1.15 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.04em;
        color: var(--hud-text);
        background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02)),
          var(--hud-bg);
        border: 1px solid var(--hud-border);
        box-shadow: 0 8px 18px rgba(2, 6, 23, 0.35), inset 0 1px 0 rgba(255,255,255,0.1);
        backdrop-filter: blur(10px) saturate(140%);
        -webkit-backdrop-filter: blur(10px) saturate(140%);
      }
      .hotbar-slot.hotbar-empty { opacity: 0.4; }
      .hotbar-key {
        color: var(--hud-accent); font-weight: 600; font-size: 9px;
        letter-spacing: 0.1em;
      }
      .hotbar-name {
        color: var(--hud-text); text-align: center;
        text-transform: uppercase; font-weight: 600;
        overflow: hidden; max-height: 2.3em;
      }
      .hotbar-qty {
        color: var(--hud-accent); font-variant-numeric: tabular-nums; min-height: 1em;
      }

      #speech-layer {
        position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1;
      }
      .speech-bubble {
        position: absolute; transform: translate(-50%, -100%);
        max-width: 220px; padding: 7px 11px; border-radius: 9px;
        font: 12px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, system-ui, sans-serif;
        letter-spacing: 0.01em;
        color: #f0e8f4;
        background: rgba(20, 12, 28, 0.88); border: 1px solid rgba(180, 120, 200, 0.45);
        box-shadow: 0 2px 8px rgba(0,0,0,0.45); text-align: center;
        white-space: pre-wrap; display: none;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .speech-bubble.tone-lucidez {
        border-color: rgba(140, 180, 220, 0.55); color: #d8e8f8;
        background: rgba(16, 24, 36, 0.9);
      }
      .speech-bubble.tone-demonio {
        border-color: rgba(200, 60, 80, 0.65); color: #f5d0d4;
        background: rgba(36, 8, 12, 0.92);
      }
      .speech-bubble.tone-ruega {
        border-color: rgba(160, 200, 120, 0.55); color: #e8f5d8;
        background: rgba(18, 28, 14, 0.9);
      }
      #dialogue-panel {
        position: absolute; left: 50%; top: 18%; transform: translateX(-50%);
        width: min(360px, calc(100% - 32px));
        z-index: 3; pointer-events: auto;
        padding: 14px 14px 12px;
        border-radius: 12px;
        color: var(--hud-text);
        font: 12px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.02em;
        background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02)),
          rgba(18, 12, 28, 0.82);
        border: 1px solid rgba(180, 130, 210, 0.35);
        box-shadow: 0 18px 40px rgba(2, 6, 23, 0.55), inset 0 1px 0 rgba(255,255,255,0.1);
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
      }
      #dialogue-panel[hidden] { display: none !important; }
      .dialogue-head {
        font-size: 12.5px; font-weight: 600; color: #e9d5ff;
        letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px;
      }
      .dialogue-trust {
        color: var(--hud-muted); margin-bottom: 10px; font-size: 11.5px;
      }
      .dialogue-trust[data-level="high"] { color: #86efac; }
      .dialogue-trust[data-level="low"] { color: #fca5a5; }
      .dialogue-trust[data-level="mid"] { color: #c4b5fd; }
      .dialogue-reply {
        margin: 0 0 10px; padding: 8px 10px; border-radius: 8px;
        background: rgba(10, 8, 16, 0.65);
        border: 1px solid rgba(180, 120, 200, 0.35);
        color: #f0e8f4; white-space: pre-wrap;
      }
      .dialogue-reply[data-tone="lucidez"] { border-color: rgba(140, 180, 220, 0.55); }
      .dialogue-reply[data-tone="demonio"] { border-color: rgba(200, 60, 80, 0.65); color: #f5d0d4; }
      .dialogue-reply[data-tone="ruega"] { border-color: rgba(160, 200, 120, 0.55); color: #e8f5d8; }
      .dialogue-options { display: flex; flex-direction: column; gap: 7px; }
      .dialogue-btn {
        cursor: pointer; text-align: left;
        padding: 8px 10px; border-radius: 8px;
        color: var(--hud-text);
        background: rgba(30, 22, 44, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.28);
        font: inherit; letter-spacing: 0.02em;
      }
      .dialogue-btn:hover, .dialogue-btn:focus-visible {
        outline: none;
        border-color: rgba(196, 181, 253, 0.7);
        background: rgba(55, 35, 80, 0.9);
      }
      .dialogue-btn.intent-amenazar:hover { border-color: rgba(248, 113, 113, 0.7); }
      .dialogue-btn.intent-calmar:hover { border-color: rgba(134, 239, 172, 0.65); }
      .dialogue-btn.intent-ofrecer:hover { border-color: rgba(217, 180, 100, 0.7); }
      .dialogue-btn.intent-ofrecer {
        border-color: rgba(120, 150, 90, 0.35);
        background: rgba(40, 48, 28, 0.55);
      }
      /* Distraer: ámbar/rojo muted (distinto de amenazar) */
      .dialogue-btn.intent-distraer {
        border-color: rgba(180, 110, 60, 0.4);
        background: rgba(48, 32, 24, 0.6);
      }
      .dialogue-btn.intent-distraer:hover {
        border-color: rgba(251, 146, 60, 0.65);
        background: rgba(70, 40, 28, 0.85);
      }
      .dialogue-hint {
        margin-top: 10px; color: var(--hud-muted); font-size: 10.5px;
        letter-spacing: 0.04em;
      }

      /* Inventario (I): panel glass-dark separado del HUD */
      #inventory-panel {
        position: absolute; right: 12px; top: 12px;
        width: min(280px, calc(100% - 24px));
        z-index: 3; pointer-events: none;
        padding: 12px 12px 10px;
        border-radius: 12px;
        color: var(--hud-text);
        font: 11.5px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.03em;
        background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02)),
          var(--hud-bg);
        border: 1px solid var(--hud-border);
        box-shadow: 0 14px 32px rgba(2, 6, 23, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        backdrop-filter: blur(12px) saturate(140%);
        -webkit-backdrop-filter: blur(12px) saturate(140%);
      }
      #inventory-panel[hidden] { display: none !important; }
      .inv-head {
        font-size: 12px; font-weight: 600; color: var(--hud-accent);
        letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px;
      }
      .inv-weight {
        color: var(--hud-muted); font-size: 10.5px; margin-bottom: 8px;
        font-variant-numeric: tabular-nums;
      }
      .inv-equip {
        display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px;
      }
      .inv-badge {
        display: inline-flex; align-items: center;
        padding: 3px 8px; border-radius: 999px;
        font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
        color: var(--hud-text);
        background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02)),
          rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(96, 165, 250, 0.35);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      }
      .inv-list {
        list-style: none; margin: 0; padding: 0;
        display: flex; flex-direction: column; gap: 4px;
        max-height: min(42vh, 320px); overflow: auto;
      }
      .inv-slot {
        display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
        padding: 6px 8px; border-radius: 8px;
        background: rgba(10, 14, 24, 0.55);
        border: 1px solid rgba(148, 163, 184, 0.16);
      }
      .inv-slot-name { color: var(--hud-text); }
      .inv-slot-qty {
        color: var(--hud-accent); font-variant-numeric: tabular-nums; font-weight: 600;
      }
      .inv-slot-weight {
        color: var(--hud-muted); font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right;
      }
      .inv-empty {
        padding: 10px 8px; color: var(--hud-muted); font-style: italic;
        border-radius: 8px; background: rgba(10, 14, 24, 0.4);
        border: 1px dashed rgba(148, 163, 184, 0.22);
        margin-bottom: 6px;
      }
      .inv-hint {
        margin-top: 10px; color: var(--hud-muted); font-size: 10.5px;
        letter-spacing: 0.04em;
      }

      /* Loading diegético (King's Gambit-style): fullscreen glass-dark */
      #loading-overlay {
        position: absolute; inset: 0; z-index: 20;
        display: flex; align-items: center; justify-content: center;
        background: rgba(6, 6, 8, 0.94);
        cursor: pointer; pointer-events: auto;
        color: var(--hud-text);
        font: 12px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.03em;
        user-select: none;
      }
      #loading-overlay[hidden], #loading-overlay.loading-dismissed {
        display: none !important;
      }
      .loading-card {
        width: min(420px, calc(100% - 48px));
        padding: 28px 24px 22px;
        border-radius: 14px;
        text-align: center;
        background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02)),
          var(--hud-bg);
        border: 1px solid var(--hud-border);
        box-shadow: 0 22px 48px rgba(2, 6, 23, 0.65), inset 0 1px 0 rgba(255,255,255,0.1);
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
      }
      .loading-title {
        font-size: 18px; font-weight: 600;
        letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--hud-accent); margin-bottom: 18px;
      }
      .loading-line {
        color: var(--hud-text); font-size: 12.5px;
        min-height: 1.45em; margin-bottom: 14px;
        font-variant-numeric: tabular-nums;
      }
      .loading-bar-track {
        height: 4px; border-radius: 999px; overflow: hidden;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.22);
        margin-bottom: 14px;
      }
      .loading-bar-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #3b82f6, #a78bfa);
        box-shadow: 0 0 10px rgba(96, 165, 250, 0.35);
        transition: width 0.12s linear;
      }
      .loading-hint {
        color: var(--hud-muted); font-size: 10.5px;
        letter-spacing: 0.05em;
      }

      /* Hit flash: vignette radial rojo fullscreen (opacity la pone game.ts) */
      #hit-flash {
        position: fixed;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(
          ellipse at center,
          rgba(180, 8, 12, 0) 32%,
          rgba(160, 10, 16, 0.45) 68%,
          rgba(120, 0, 8, 0.95) 100%
        );
      }

      /* Loot toast: JS createLootFloaterHud pisa con inline; no usar [hidden] */
      #loot-floater {
        display: none;
        position: fixed;
        left: 50%;
        top: 34%;
        transform: translate(-50%, 0);
        z-index: 9999;
        pointer-events: none;
        color: #ffe080;
        font: 800 42px/1 ui-monospace, monospace;
        text-shadow: 0 2px 14px #000, 0 0 22px rgba(255,224,128,.75);
        white-space: nowrap;
      }
      #loot-floater.loot-floater-play {
        animation: loot-float 4s ease-out forwards;
      }
      @keyframes loot-float {
        0% { opacity: 1; transform: translate(-50%, 8px); }
        55% { opacity: 1; transform: translate(-50%, -18px); }
        100% { opacity: 0; transform: translate(-50%, -72px); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hit-flash" aria-hidden="true"></div>
    <div id="loot-floater" aria-hidden="true"></div>
    <div id="speech-layer"></div>
    <div id="hud">cargando… · F1 ayuda</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
